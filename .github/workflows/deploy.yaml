name: Train Schedule CI/CD
## 
on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  APP_NAME: train-schedule
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ============================================================
  # JOB 1 - BUILD AND TEST
  # ============================================================

  build-test:

    name: Build and Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ============================================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  docker-build-push:

    name: Build and Push Docker Image

    needs: build-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Docker Hub credentials
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "ERROR: DOCKER_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "ERROR: DOCKER_PASSWORD secret is missing"
            exit 1
          fi

          echo "Docker Hub credentials are configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/train-schedule:${{ steps.image.outputs.tag }} \
            -t ${{ secrets.DOCKER_USERNAME }}/train-schedule:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/train-schedule:${{ steps.image.outputs.tag }}

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/train-schedule:latest

      - name: Display Docker image
        run: |
          echo "Docker image:"
          echo "${{ secrets.DOCKER_USERNAME }}/train-schedule:${{ steps.image.outputs.tag }}"


  # ============================================================
  # JOB 3 - DEPLOY TO KUBEADM KUBERNETES
  # ============================================================

  deploy:

    name: Deploy to kubeadm Kubernetes

    needs: docker-build-push

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Copy Kubernetes manifest to Kubernetes control-plane
      # --------------------------------------------------------

      - name: Copy Kubernetes manifest
        uses: uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_MASTER_HOST }}
          username: ${{ secrets.K8S_MASTER_USER }}
          key: ${{ secrets.K8S_MASTER_SSH_KEY }}
          source: "deployment.yaml"
          target: "k8s"

      # --------------------------------------------------------
      # SSH to Kubernetes control-plane
      # --------------------------------------------------------

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.K8S_MASTER_HOST }}
          username: ${{ secrets.K8S_MASTER_USER }}
          key: ${{ secrets.K8S_MASTER_SSH_KEY }}

          script: |

            set -e

            echo "=========================================="
            echo "Starting Kubernetes Deployment"
            echo "=========================================="

            SHORT_SHA=$(echo "$IMAGE_TAG" | cut -c1-7)

            IMAGE="$DOCKERHUB_USERNAME/train-schedule:$SHORT_SHA"

            echo "Docker Image:"
            echo "$IMAGE"

            echo ""
            echo "=========================================="
            echo "Checking Kubernetes Cluster"
            echo "=========================================="

            kubectl get nodes

            echo ""
            echo "=========================================="
            echo "Kubernetes Version"
            echo "=========================================="

            kubectl version --short 2>/dev/null || kubectl version

            echo ""
            echo "=========================================="
            echo "Updating Kubernetes Manifest"
            echo "=========================================="

            sed -i \
              "s|DOCKER_IMAGE_PLACEHOLDER|$IMAGE|g" \
              k8s/deployment.yaml

            echo "Manifest image:"
            grep "image:" /k8s/deployment.yaml

            echo ""
            echo "=========================================="
            echo "Applying Kubernetes Manifest"
            echo "=========================================="

            kubectl apply -f /k8s/deployment.yaml

            echo ""
            echo "=========================================="
            echo "Waiting for Deployment"
            echo "=========================================="

            kubectl rollout status \
              deployment/train-schedule-deployment \
              --timeout=180s

            echo ""
            echo "=========================================="
            echo "Deployment"
            echo "=========================================="

            kubectl get deployment train-schedule-deployment

            echo ""
            echo "=========================================="
            echo "Pods"
            echo "=========================================="

            kubectl get pods -o wide

            echo ""
            echo "=========================================="
            echo "Service"
            echo "=========================================="

            kubectl get service train-schedule-service

            echo ""
            echo "=========================================="
            echo "Deployment Completed Successfully"
            echo "=========================================="
