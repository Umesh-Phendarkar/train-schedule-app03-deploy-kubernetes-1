name: Build and Deploy Train Schedule

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/train-schedule

jobs:

  # ==========================================================
  # 1. BUILD AND TEST
  # ==========================================================
  build-test:

    name: Build and Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ==========================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ==========================================================
  docker-build-push:

    name: Build and Push Docker Image

    needs: build-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t $DOCKER_IMAGE:${{ steps.image.outputs.tag }} \
            -t $DOCKER_IMAGE:latest \
            .

      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE:${{ steps.image.outputs.tag }}
          docker push $DOCKER_IMAGE:latest

      - name: Display image
        run: |
          echo "Docker image:"
          echo "$DOCKER_IMAGE:${{ steps.image.outputs.tag }}"


  # ==========================================================
  # 3. DEPLOY TO KUBERNETES
  # ==========================================================
  deploy:

    name: Deploy to kubeadm Kubernetes

    needs: docker-build-push

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Copy Kubernetes manifest to control plane
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.K8S_MASTER_HOST }}
          username: ${{ secrets.K8S_MASTER_USER }}
          key: ${{ secrets.K8S_MASTER_SSH_KEY }}
          source: "deployment.yaml"
          target: "/tmp"

      - name: Deploy application to Kubernetes
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.K8S_MASTER_HOST }}
          username: ${{ secrets.K8S_MASTER_USER }}
          key: ${{ secrets.K8S_MASTER_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Kubernetes Deployment"
            echo "======================================"

            echo "Docker image:"
            echo "${DOCKER_IMAGE}:${IMAGE_TAG:0:7}"

            echo "Checking Kubernetes cluster..."

            kubectl get nodes

            echo "Replacing Docker image in manifest..."

            sed -i \
              "s|\${DOCKER_IMAGE_NAME}:\${BUILD_NUMBER}|${DOCKER_IMAGE}:${IMAGE_TAG:0:7}|g" \
              /tmp/train-schedule-kube.yml

            echo "Applying Kubernetes manifest..."

            kubectl apply -f /tmp/train-schedule-kube.yml

            echo "Waiting for deployment..."

            kubectl rollout status \
              deployment/train-schedule-deployment \
              --timeout=180s

            echo "======================================"
            echo "Deployment Status"
            echo "======================================"

            kubectl get deployment train-schedule-deployment

            kubectl get pods -o wide

            kubectl get service train-schedule-service

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"
